name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Frontend and Rust (Linux)
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v5.1.0; update this SHA when renewing the action.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # pnpm/action-setup v5.0.0; update this SHA when renewing the action.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12.4.1
          run_install: false
      # actions/setup-node v5.0.0; update this SHA when renewing the action.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: pnpm
      # dtolnay/rust-toolchain 2026-09-03; update this SHA when renewing the action.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # Swatinem/rust-cache v2; update this SHA when renewing the action.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  windows-rust:
    name: Rust cfg(not(unix)) (Windows)
    runs-on: windows-latest
    steps:
      # actions/checkout v5.1.0; update this SHA when renewing the action.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain 2026-09-03; update this SHA when renewing the action.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # Swatinem/rust-cache v2; update this SHA when renewing the action.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - run: git diff --exit-code -- src-tauri/Cargo.lock
